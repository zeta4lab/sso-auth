# 로컬 개발용 Hydra 구성.
# 주의: 이 파일은 Docker가 없는 환경에서 작성되어 아직 실행 검증되지 않았다.
# 처음 띄울 때 hydra-migrate가 성공하는지부터 확인할 것.
services:
  hydra-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra-dev-only
      POSTGRES_DB: hydra
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hydra']
      interval: 5s
      retries: 10

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      DSN: postgres://hydra:hydra-dev-only@hydra-postgres:5432/hydra?sslmode=disable
    depends_on:
      hydra-postgres:
        condition: service_healthy
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev
    environment:
      DSN: postgres://hydra:hydra-dev-only@hydra-postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: http://127.0.0.1:4444
      # 액세스 토큰을 JWT로 발급해야 리소스 서버가 JWKS로 로컬 검증할 수 있다.
      # 기본값(opaque)이면 매 요청 introspection이 필요해 설계가 무너진다.
      STRATEGIES_ACCESS_TOKEN: jwt
      TTL_ACCESS_TOKEN: 15m
      OAUTH2_EXPOSE_INTERNAL_ERRORS: 'false'
      SECRETS_SYSTEM: dev-only-change-me-0123456789
    ports:
      - '4444:4444' # public: 토큰 발급, JWKS
      - '4445:4445' # admin: 절대 외부로 열지 않는다
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  sso-auth:
    build: ..
    environment:
      PORT: 8080
      ADMIN_API_TOKEN: dev-only-admin-token-0123456789
      HYDRA_ADMIN_URL: http://hydra:4445
      HYDRA_PUBLIC_URL: http://127.0.0.1:4444
    ports:
      - '8080:8080'
    depends_on:
      - hydra
